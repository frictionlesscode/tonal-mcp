[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonal-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "fastmcp",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tonal_mcp = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits the real Tonal account (needs TONAL_EMAIL/TONAL_PASSWORD in .env); excluded by default, run with `pytest -m integration`",
]
addopts = "-m 'not integration'"
